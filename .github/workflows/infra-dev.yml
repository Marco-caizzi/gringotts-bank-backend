name: infra-dev

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build lambda package
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
          go build -tags "lambda.norpc" -ldflags "-s -w" -o bootstrap ./lambda/GetHealthcheckAPI/cmd
          mkdir -p dist
          zip -j dist/health.zip bootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install Terragrunt
        run: |
          TG_VERSION=0.67.4
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform fmt (repo)
        run: terraform fmt -check -recursive

      - name: Terraform validate (app)
        run: |
          terraform -chdir=infra/terraform/app init -backend=false -upgrade
          terraform -chdir=infra/terraform/app validate -no-color

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terragrunt plan (app)
        working-directory: infra/terragrunt/live/dev/app
        run: |
          terragrunt run-all init -upgrade --terragrunt-non-interactive
          terragrunt run-all plan --terragrunt-non-interactive

      - name: Terragrunt plan (health)
        working-directory: infra/terragrunt/live/dev/health
        run: |
          terragrunt init -upgrade
          terragrunt plan -input=false -lock=false

  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build lambda package
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
          go build -tags "lambda.norpc" -ldflags "-s -w" -o bootstrap ./lambda/GetHealthcheckAPI/cmd
          mkdir -p dist
          zip -j dist/health.zip bootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install Terragrunt
        run: |
          TG_VERSION=0.67.4
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform fmt (repo)
        run: terraform fmt -check -recursive

      - name: Terraform validate (app)
        run: |
          terraform -chdir=infra/terraform/app init -backend=false -upgrade
          terraform -chdir=infra/terraform/app validate -no-color

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terragrunt apply (app)
        working-directory: infra/terragrunt/live/dev/app
        run: |
          terragrunt run-all apply -auto-approve --terragrunt-non-interactive

      - name: Terragrunt apply (health)
        working-directory: infra/terragrunt/live/dev/health
        run: |
          terragrunt apply -auto-approve -input=false -lock=false
