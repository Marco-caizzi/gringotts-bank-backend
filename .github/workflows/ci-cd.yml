name: ci-cd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Go mod tidy
        run: go mod tidy
      - name: Run tests
        run: go test ./...
      - name: Build lambda package
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags lambda.norpc -ldflags "-s -w" -o bootstrap ./lambda/GetHealthcheckAPI/cmd
          mkdir -p dist
          (cd . && zip -j dist/health.zip bootstrap)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-zip
          path: dist/health.zip

  deploy-dev:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TG_DIR: infra/terragrunt/live/dev/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: health-zip
          path: dist
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Setup Terragrunt
        run: |
          TG_VERSION=0.67.4
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: Terragrunt apply
        working-directory: ${{ env.TG_DIR }}
        run: |
          terragrunt init -no-color
          terragrunt apply -auto-approve -no-color
