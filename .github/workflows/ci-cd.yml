name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Go mod tidy
        run: go mod tidy

      - name: Run tests with coverage
        run: go test -cover ./...

      - name: Build lambda package (sanity)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
          go build -tags lambda.norpc -ldflags "-s -w" -o bootstrap ./lambda/GetHealthcheckAPI/cmd
          mkdir -p dist
          (cd . && zip -j dist/health.zip bootstrap)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-zip
          path: dist/health.zip
